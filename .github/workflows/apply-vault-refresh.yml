name: Apply Vault Studio refresh

on:
  push:
    branches:
      - vault-ui-refresh-aug-2026

permissions:
  contents: write

jobs:
  refresh-vault:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out refresh branch
        uses: actions/checkout@v4
        with:
          ref: vault-ui-refresh-aug-2026
      - name: Apply refreshed Vault page
        run: python scripts/apply_vault_refresh.py
      - name: Commit refreshed page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Harvey_Vault_Set_Up_Walkthrough.html"
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Vault Studio for August 2026"
          git push origin HEAD:vault-ui-refresh-aug-2026
