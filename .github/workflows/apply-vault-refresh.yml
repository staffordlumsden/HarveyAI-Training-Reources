name: Apply Vault Studio refresh

on:
  push:
    branches:
      - vault-ui-refresh-aug-2026

permissions:
  contents: write

jobs:
  refresh-vault:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out refresh branch
        uses: actions/checkout@v4
        with:
          ref: vault-ui-refresh-aug-2026
      - name: Write refreshed Vault Studio
        env:
          VAULT_HTML_ZLIB_B64: 