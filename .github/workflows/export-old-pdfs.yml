name: Export old PDFs
on:
  push:
    branches:
      - pdf-resource-replacement-aug-2026
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pdf-resource-replacement-aug-2026
      - uses: actions/upload-artifact@v4
        with:
          name: old-pdfs
          path: resources/*.pdf
          if-no-files-found: error
